<!-- HiVo index.html (FIXED) — key part: multi-source loader -->\n<script>\nconst SUB_URLS = [\n  './sub.txt',\n  'https://raw.githubusercontent.com/hivaasadi8/HiVoConfigs/main/sub.txt',\n  'https://cdn.jsdelivr.net/gh/hivaasadi8/HiVoConfigs@main/sub.txt'\n];\nasync function loadSubs(){\n  for (const u of SUB_URLS){\n    try{\n      const r = await fetch(u, {cache:'no-store'});\n      if(!r.ok) continue;\n      let t = (await r.text()).trim();\n      if(!t.includes('://')){ // maybe base64\n        try{ t = atob(t.replace(/\\s+/g,'')); }catch(e){}\n      }\n      const lines = t.split(/\\r?\\n/).filter(x=>/^(vless|vmess|trojan|ss):\\/\\//i.test(x.trim()));\n      if(lines.length) return lines;\n    }catch(e){}\n  }\n  throw new Error('sub.txt not reachable');\n}\n<\/script>\n<!-- + copy buttons, protocol chips, QR modal, search (see live demo above) -->\n<!-- Pages: Settings > Pages > Branch main / root -->\n

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HiVo Configs</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Tahoma,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px;max-width:820px;margin:0 auto;min-height:100vh}
  h1{font-size:1.5rem;margin:0 0 8px}
  #status{opacity:.75;margin:0 0 18px;font-size:.9rem}
  .bar{display:flex;gap:8px;margin-bottom:14px}
  .bar input{flex:1;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:10px;border-radius:8px;font-size:.9rem}
  .sub-list{list-style:none;padding:0;margin:0}
  .sub-list li{background:#161b22;border:1px solid #30363d;padding:12px;border-radius:8px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .proto{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600}
  .vmess{background:#8957e5;color:#fff}
  .vless{background:#1f6feb;color:#fff}
  .trojan{background:#da3633;color:#fff}
  .ss{background:#d29922;color:#000}
  .idx{opacity:.55;font-size:.8rem}
  button{background:#238636;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;margin-right:auto}
  button:hover{background:#2ea043}
  button:active{transform:scale(.97)}
  .line{font-size:.75rem;opacity:.55;word-break:break-all;line-height:1.5;max-height:60px;overflow:hidden}
</style>
</head>
<body>
<h1>⚡️ HiVo Configs</h1>
<p id="status">در حال بارگذاری…</p>
<div class="bar">
  <input id="q" placeholder="🔍 جستجو در کانفیگ‌ها…">
</div>
<ul class="sub-list" id="list"></ul>

<script>
const SUB_URLS = [
  './sub.txt',
  'https://raw.githubusercontent.com/hivaasadi8/HiVoConfigs/main/sub.txt',
  'https://cdn.jsdelivr.net/gh/hivaasadi8/HiVoConfigs@main/sub.txt'
];

const protoOf = u => (u.match(/^([a-z0-9]+):\/\//i) || [, 'other'])[1].toLowerCase();

async function loadSubs(){
  for (const u of SUB_URLS){
    try{
      const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) continue;
      let t = (await r.text()).trim();
      if(!t.includes('://')){ try{ t = atob(t.replace(/\s+/g,'')); }catch(e){} }
      const lines = t.split(/\r?\n/).map(x=>x.trim())
        .filter(x=>/^(vless|vmess|trojan|ss|hysteria2?):\/\//i.test(x));
      if(lines.length) return lines;
    }catch(e){}
  }
  throw new Error('sub.txt در دسترس نیست');
}

let ALL = [];
function render(lines){
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  status.textContent = lines.length + ' کانفیگ فعال';
  list.innerHTML = '';
  lines.forEach((line,i)=>{
    const p = protoOf(line);
    const safe = line.length > 140 ? line.substring(0,140)+'…' : line;
    const li = document.createElement('li');
    li.innerHTML =
      '<div class="row">' +
        '<span class="proto '+p+'">'+p.toUpperCase()+'</span>' +
        '<span class="idx">#'+(i+1)+'</span>' +
        '<button>کپی</button>' +
      '</div>' +
      '<div class="line">'+safe.replace(/[<>]/g,'')+'</div>';
    li.querySelector('button').onclick = (ev)=>{
      navigator.clipboard.writeText(line);
      ev.target.textContent = '✓ کپی شد';
      setTimeout(()=>ev.target.textContent='کپی',1200);
    };
    list.appendChild(li);
  });
}

document.getElementById('q').oninput = (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(ALL); return; }
  const filtered = ALL.filter(l=>l.toLowerCase().includes(q));
  render(filtered);
};

loadSubs().then(l=>{ALL=l;render(l);}).catch(e=>{
  document.getElementById('status').textContent = '⚠️ ' + e.message;
});
</script>
</body>
</html>

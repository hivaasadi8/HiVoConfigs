name: HiVo Configs Auto-Tester & Bot

on:
  schedule:
    - cron: '*/45 * * * *'  # Runs every 45 minutes
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tester.py'
      - 'main.py'
      - 'store.py'

concurrency:
  group: hivo-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Utilities & Xray
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl unzip
          mkdir -p /tmp/xray
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray/xray.zip
          unzip -qo /tmp/xray/xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          sudo mkdir -p /usr/local/share/xray
          [ -f /tmp/xray/geoip.dat ] && sudo mv /tmp/xray/geoip.dat /usr/local/share/xray/
          [ -f /tmp/xray/geosite.dat ] && sudo mv /tmp/xray/geosite.dat /usr/local/share/xray/
          xray version

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Single Fast Test Cycle & Update Sub
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          python -c '
          from tester import run_cycle, S
          run_cycle()
          print("Cycle completed! Good configs:", len(S["good"]))
          '

      - name: Commit & Push sub.txt (Prevent Pages Build Loop)
        run: |
          git config --global user.name "HiVo-Bot"
          git config --global user.email "bot@hivo.local"
          git add sub.txt data/
          git diff --staged --quiet || (git commit -m "update sub configs [skip ci]" && git push)

name: HiVo Auto-Update 🌐

on:
  schedule:
    - cron: '*/45 * * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'tester.py'
      - 'store.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: hivo-auto-update
  cancel-in-progress: false

jobs:
  update-sub:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ─────────────────────────────
      # Checkout
      # ─────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────
      # Python
      # ─────────────────────────────
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ─────────────────────────────
      # Dependencies
      # ─────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────
      # Run tester
      # ─────────────────────────────
      - name: 🧪 Run HiVo tester
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p data

          echo "🚀 Starting HiVo tester..."
          python tester.py

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Checking generated files"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # sub.txt MUST exist
          if [ ! -f sub.txt ]; then
            echo "❌ ERROR: sub.txt was not created."
            exit 1
          fi

          # sub.txt MUST NOT be empty
          if [ ! -s sub.txt ]; then
            echo "❌ ERROR: sub.txt is empty."
            exit 1
          fi

          SUB_LINES=$(grep -cve '^[[:space:]]*$' sub.txt || true)

          echo "✅ sub.txt exists"
          echo "📄 Config lines: $SUB_LINES"

          if [ "$SUB_LINES" -eq 0 ]; then
            echo "❌ ERROR: sub.txt contains no configs."
            exit 1
          fi

          # Optional Base64 file
          if [ -f sub_base64.txt ]; then
            echo "✅ sub_base64.txt found"
          else
            echo "ℹ️ sub_base64.txt not generated — continuing."
          fi

          # Optional cache
          if [ -f data/tester_cache.json ]; then
            echo "✅ tester cache found"
          else
            echo "ℹ️ tester cache not generated."
          fi

      # ─────────────────────────────
      # Validate subscription
      # ─────────────────────────────
      - name: 🔍 Validate subscription
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sub.txt")

          if not path.exists():
              raise SystemExit("❌ sub.txt does not exist")

          text = path.read_text(
              encoding="utf-8",
              errors="ignore"
          ).strip()

          if not text:
              raise SystemExit("❌ sub.txt is empty")

          lines = [
              line.strip()
              for line in text.splitlines()
              if line.strip()
          ]

          print(f"✅ Valid subscription entries: {len(lines)}")

          # Basic sanity check:
          # every generated line should at least contain a URI scheme.
          valid = sum(
              1 for line in lines
              if "://" in line
          )

          print(f"🔗 URI-like entries: {valid}")

          if valid == 0:
              raise SystemExit(
                  "❌ No valid config URI detected in sub.txt"
              )
          PY

      # ─────────────────────────────
      # Commit & Push
      # ─────────────────────────────
      - name: 💾 Commit updated files
        run: |
          git config user.name "HiVo-Bot"
          git config user.email "bot@hivo.local"

          # Required output
          git add -f sub.txt

          # Optional output
          if [ -f sub_base64.txt ]; then
            git add -f sub_base64.txt
          fi

          # Cache
          if [ -f data/tester_cache.json ]; then
            git add -f data/tester_cache.json
          fi

          # Nothing changed
          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected."
            exit 0
          fi

          echo "📦 Changes detected:"
          git diff --cached --stat

          git commit -m "⚡️ Update HiVo subscription [skip ci]"

          git push

          echo "✅ Update pushed successfully."

name: HiVo Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hivo-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Xray binary
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ runner.os }}-v1

      - name: Run bot (auto-restart)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          MAX_TO_TEST: "10000"
          QUICK_N: "3000"
          DEEP_QUICK: "500"
          DEEP_LIMIT: "800"
          BATCH_SIZE: "1000"
          WAVE: "100"
          TCP_TIMEOUT: "2.5"
          TCP_WORKERS: "400"
          DEEP_WORKERS: "50"
          DEEP_TIMEOUT: "6"
          SPEED_BYTES: "262144"
          REFRESH_EVERY: "1800"
        run: |
          end=$((SECONDS + 330*60))
          n=0
          while [ $SECONDS -lt $end ]; do
            n=$((n+1))
            remain=$((end - SECONDS))
            echo "=== run #$n | elapsed ${SECONDS}s | remaining ${remain}s ==="
            timeout "$remain" python main.py
            code=$?
            if [ $code -eq 124 ]; then
              echo "time budget reached — exiting"
              break
            fi
            echo "exited with code $code — restart in 5s"
            sleep 5
          done

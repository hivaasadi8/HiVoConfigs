name: HiVo Auto-Update 🌐\n\non:\n  schedule:\n    - cron: '*/45 * * * *'\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths: ['tester.py','store.py','requirements.txt']\n\npermissions:\n  contents: write\n  pages: write\n\nconcurrency:\n  group: hivo-update\n  cancel-in-progress: true\n\njobs:\n  update-sub:\n    runs-on: ubuntu-latest\n    timeout-minutes: 35\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n          cache: pip\n      - name: Install deps\n        run: |\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n      - name: Run test cycle\n        env:\n          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}\n        run: |\n          mkdir -p data\n          python tester.py\n          echo '--- sub lines:'\n          wc -l sub.txt || echo 'sub.txt missing!'\n          test -s sub.txt || (echo 'ERROR: sub.txt empty' && exit 1)\n      - name: Commit sub\n        run: |\n          git config user.name 'HiVo-Bot'\n          git config user.email 'bot@hivo.local'\n          git add -f sub.txt sub_base64.txt data/tester_cache.json\n          git diff --staged --quiet || git commit -m '⚡️ update sub [skip ci]'\n          git push || echo 'nothing to push'\n
